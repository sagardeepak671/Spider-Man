<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<!-- phones: no pinch / double tap zoom (the game has its own touch buttons), use the whole screen incl. notches -->
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="theme-color" content="#000000">
	<meta name="description"
                content="A Simple Spiderman Game in HTML5, CSS3 and Javascript" />
	<title>Spider-Man Game | A spiderman game to fight with more Villains of Spider-Man</title>
	<link rel="shortcut icon" href="images/spider-head.png" />
	<style type="text/css">
		html,
		body {
			height: 100%;
			width: 100%;
			margin: 0;
			padding: 0;
			overflow: hidden;
			background: #000;
			/* no pull-to-refresh / bounce, no double tap zoom on phones */
			overscroll-behavior: none;
			touch-action: manipulation;
			-webkit-text-size-adjust: 100%;
		}
	</style>
</head>
<body>
	<canvas id="canvas"></canvas>

	<script type="text/javascript" src="spiderman-game.js"></script>
	<!-- campaign worlds / stages (loaded after the engine, before the game is created) -->
	<script type="text/javascript" src="campaign-levels.js"></script>
	<script type="text/javascript">
		// fitToWindow scales the game to fill the browser window (press F or use the menu for real full screen)
		var game = new SpidermanGame({
			canvas: "#canvas",
			fitToWindow: true
		});
		game.load();
	</script>
</body>
</html>
